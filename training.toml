schema_version = 2
id = "python-dashboards"
title = "Python dashboards"
content_language = "en"
summary = """
A dashboard is a useful tool to present data for reporting and exploration. The added value is that a dashboard can be interactive. Python has several frameworks to easily create dashboards, and you will learn about their relative strengths and weaknesses based on some real-world use cases.
"""
languages = ["Python"]

[[learning_outcomes]]
statement = "Be able to create simple dashboards for reporting purposes."
competencies = ["dashboards.create-interactive-dashboards"]

[[learning_outcomes]]
statement = "Be able to create simple web applications."
competencies = ["dashboards.create-small-web-applications"]

[[learning_outcomes]]
statement = "Learn how to deploy dashboards on GitHub."
competencies = ["dashboards.select-and-deploy-frameworks"]

[[learning_outcomes]]
statement = "Learn how to deploy web applications on streamlit.io."
competencies = ["dashboards.select-and-deploy-frameworks"]

[[learning_outcomes]]
statement = "Learn how to deploy a web application on Amazon EC2."
competencies = ["dashboards.select-and-deploy-frameworks"]

[[learning_outcomes]]
statement = "Know which libraries and frameworks to choose depending on your project requirements."
competencies = ["dashboards.select-and-deploy-frameworks"]

[source]
metadata_document = "docs/README.md"
repository_url = "https://github.com/gjbex/Python-dashboards/"
website_url = "https://gjbex.github.io/Python-dashboards/"
license = "CC-BY-4.0"

[delivery]
duration_minutes = 120
duration_kind = "fixed"
session_count = 1
target_session_duration_minutes = 120
schedule_complete = true
description = """
Total duration: 2 hours.
"""

[audience]
description = """
This training is for you if you need to use Python to build simple dashboards or lightweight data applications.
"""

[prerequisites]
summary = """
You will need experience programming in Python. This is not a training that starts from scratch. Familiarity with pandas is not required, but would be beneficial. If you plan to do Python programming in a Linux or HPC environment you should be familiar with these as well. More concretely, participants should already be comfortable with the following: * running Python code in Jupyter notebooks or from the command line; * variables, numbers, strings, booleans, and basic containers such as lists and dictionaries; * `if`/`else` statements, `for` loops, and writing simple functions; * importing modules and reading short Python scripts or notebook cells; * basic NumPy usage such as creating arrays and applying simple vectorized operations; * basic plotting with matplotlib, for example creating a line plot and setting labels; * making small changes to example code and rerunning it. You do not need prior experience with dashboard frameworks such as Panel, Streamlit, Dash, Gradio, or ipywidgets. Those are part of the training itself.
"""
competencies = ["python.run-code", "python.values-and-containers", "python.control-flow-and-comprehensions", "python.functions", "python.import-modules", "numpy.vectorized-computations", "matplotlib.create-basic-plots"]

[self_assessment]
introduction = """
If you can do most of the tasks below without looking up basic Python syntax, you are likely ready for this training.
"""
tasks = [
  "Write a function that computes values for a curve and plots them.",
  "Create a NumPy array with evenly spaced values and apply a mathematical function to it.",
  "Make a simple matplotlib plot and explain what the axes represent.",
  "Read a short notebook cell that imports data or libraries, computes values, and plots a result.",
  "Change a parameter in an example script or notebook and run it again.",
  "Use a loop or function to organize a small piece of Python code.",
  "Read a short traceback and identify roughly where the problem occurred."
]

[requirements]
software = [
  "A laptop or desktop with internet access.",
  "A Python environment with JupyterLab, Panel, Streamlit, Dash, Gradio, ipywidgets, NumPy, pandas, matplotlib, Altair, and related packages.",
  "The top-level `environment.yml` file if you want to create the portable conda environment.",
  "The `python_dashboards_linux64_conda_specs.txt` file if you need the recorded Linux conda package specification.",
  "A browser that can open local dashboard applications.",
  "Access to Google Colaboratory if you prefer not to install software locally."
]

[level]
introductory_percent = 35
intermediate_percent = 50
advanced_percent = 15
description = """
For participants who already have basic Python programming experience, the material in this training is approximately These percentages describe the level of the dashboard and deployment topics covered in the training, not the required entry level in Python itself.
"""

[[materials]]
kind = "slides"
path = "python_dashboards.pptx"

[[materials]]
kind = "source-code"
path = "source_code"

[[materials]]
kind = "exercises"
path = "hands_on"

[[materials]]
kind = "environment"
path = "environment.yml"

